# Rigenera index.html quando cambiano i contenuti (es. modifiche da Pages CMS)
# e committa il risultato: GitHub Pages pubblica poi il branch main come oggi.
name: Build sito

on:
  push:
    branches: [main]
    paths:
      - content.json
      - template.html
      - styles.css
      - build.py
      - "src/**"
      - "!src/_opt/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sito
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jinja2 pillow markdown

      - run: python build.py

      - name: Commit dei file generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml src/_opt
          git diff --cached --quiet && echo "Nessuna modifica" && exit 0
          git commit -m "Build automatica da content.json"
          git push
